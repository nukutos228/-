<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10182f">
<title>Священные кошки Древнего Египта 🐈</title>
<style>
:root{--bg:#10182f;--gold:#f5cb70;--light:#ffe8a9;--text:#f9f5e9;--muted:#c2c9d8;--green:#55d6a0;--red:#ff7777}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px;display:flex;align-items:center;justify-content:center;color:var(--text);background:radial-gradient(ellipse at top,#34436b,transparent 55%),linear-gradient(145deg,#10182f,#182544,#0c1225);font:16px Arial,sans-serif;overflow-x:hidden}
body:before,body:after{position:fixed;color:#f5cb701c;font-size:90px;pointer-events:none}
body:before{content:"𓂀";top:10px;left:15px}
body:after{content:"𓃠";bottom:5px;right:15px}
.app{width:100%;max-width:760px;margin:auto;position:relative;z-index:1;animation:appear .7s ease}
header{text-align:center;margin-bottom:22px}
.eyebrow{color:var(--gold);font-size:11px;font-weight:bold;letter-spacing:3px;margin-bottom:12px}
h1{font: bold clamp(29px,6vw,46px)/1.15 Georgia,serif;color:var(--light);margin:0;text-shadow:0 0 25px #f5cb7029}
.subtitle{color:var(--muted);line-height:1.6;font-size:14px}
.ornament{color:var(--gold);margin-top:15px}
.card{background:linear-gradient(145deg,#1f2d4cf7,#121c32fa);border:1px solid #f5cb706b;border-radius:23px;padding:clamp(20px,5vw,35px);box-shadow:0 25px 70px #0005;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:15%;right:15%;height:2px;background:var(--gold)}
.topline{display:flex;justify-content:space-between;gap:10px;margin-bottom:13px}
.counter{color:var(--gold);font-size:12px;font-weight:bold;letter-spacing:1px}
.score-label{color:var(--muted);font-size:13px}
.track{height:8px;background:#0c1428;border-radius:20px;overflow:hidden;margin-bottom:28px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#c9963b,#ffe8a9);box-shadow:0 0 15px #f5cb7073;transition:width .5s}
.question{animation:slide .4s ease}
.qnum{color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:bold;margin-bottom:10px}
h2{font: bold clamp(21px,4.5vw,29px)/1.4 Georgia,serif;margin:0 0 22px}
.answers{display:grid;gap:11px}
.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:14px;color:var(--text);background:#ffffff09;border:1px solid #ffffff20;border-radius:13px;cursor:pointer;line-height:1.45;transition:.2s;animation:slide .35s ease both}
.answer:nth-child(2){animation-delay:.04s}.answer:nth-child(3){animation-delay:.08s}.answer:nth-child(4){animation-delay:.12s}
.answer:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold);background:#f5cb7017}
.answer:disabled{cursor:default}
.letter{flex:0 0 31px;height:31px;display:grid;place-items:center;border-radius:9px;color:var(--gold);background:#f5cb7019;border:1px solid #f5cb7040;font-weight:bold}
.correct{border-color:var(--green)!important;background:#55d6a022!important;animation:pop .3s}
.correct .letter{background:var(--green);color:#10271e}
.wrong{border-color:var(--red)!important;background:#ff77771c!important;animation:shake .3s}
.wrong .letter{background:var(--red);color:#351313}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:12px;line-height:1.6;animation:slide .3s}
.feedback.show{display:block}.good{background:#55d6a015;border:1px solid #55d6a066}.bad{background:#ff777710;border:1px solid #ff777766}
.feedback-title{font-weight:bold;margin-bottom:5px}.good .feedback-title{color:var(--green)}.bad .feedback-title{color:var(--red)}
.feedback-text{font-size:14px;color:#e1e6f0}
.controls{display:flex;justify-content:flex-end;margin-top:20px}
button{font:inherit}
.primary,.secondary{border-radius:12px;padding:13px 20px;font-weight:bold;cursor:pointer;transition:.2s}
.primary{border:0;color:#20233a;background:linear-gradient(135deg,#ffe8a9,#e7b954);box-shadow:0 7px 20px #f5cb7026}
.primary:hover{transform:translateY(-2px);box-shadow:0 10px 25px #f5cb7040}
.secondary{color:var(--light);background:transparent;border:1px solid #f5cb7080}
.hidden{display:none!important}
.result{text-align:center;animation:appear .6s ease}
.trophy{font-size:60px;display:inline-block;animation:float 2s ease-in-out infinite}
.result h2{color:var(--light);margin:12px 0}
.description{color:var(--muted);line-height:1.7;max-width:460px;margin:0 auto 20px}
.circle{width:150px;height:150px;margin:25px auto;border:4px solid var(--gold);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5cb7010;box-shadow:0 0 30px #f5cb7020;animation:pop .6s}
.number{font-size:40px;font-weight:900;color:var(--light)}
.caption{font-size:12px;color:var(--muted)}
.footer{text-align:center;color:#8995ad;font-size:12px;line-height:1.7;margin-top:20px}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
@media(max-width:520px){body{padding:18px 10px}.card{border-radius:19px}.answer{padding:12px;gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="eyebrow">ДРЕВНИЙ ЕГИПЕТ · ПОЗНАВАТЕЛЬНЫЙ КВИЗ</div>
<h1>Священные кошки<br>Древнего Египта</h1>
<p class="subtitle">Проверь знания о кошках, богах и тайнах древней цивилизации.</p>
<div class="ornament">𓃠 ✦ 𓂀</div>
</header>
<section class="card">
<div id="quiz">
<div class="topline"><span class="counter" id="counter"></span><span class="score-label" id="score"></span></div>
<div class="track"><div class="bar" id="bar"></div></div>
<div class="question" id="question">
<div class="qnum" id="qnum"></div>
<h2 id="qtext"></h2>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"><div class="feedback-title" id="ftitle"></div><div class="feedback-text" id="ftext"></div></div>
<div class="controls"><button class="primary hidden" id="next">Следующий вопрос →</button></div>
</div>
</div>
<div class="result hidden" id="result">
<div class="trophy" id="trophy">🏆</div>
<h2 id="rtitle"></h2>
<p class="description" id="rdesc"></p>
<div class="circle"><div class="number" id="final"></div><div class="caption">правильных ответов</div></div>
<p class="description" id="advice"></p>
<button class="primary" id="restart">↻ Пройти ещё раз</button>
</div>
</section>
<footer class="footer">𓂀 · Путешествие в мир Древнего Египта · 𓃠<br>Каждый ответ приближает к разгадке истории.</footer>
</main>
<script>
"use strict";
const questions=[
["Какую богиню изображали с головой кошки?",["Бастет","Исида","Нефтида","Маат"],0,"Бастет связывали с защитой дома, плодородием, радостью и кошками."],
["Какую роль кошки играли в повседневной жизни?",["Охраняли зерно от грызунов","Строили пирамиды","Управляли Нилом","Заменяли писцов"],0,"Кошки защищали запасы пищи от мышей и крыс."],
["Какая река была важнейшей для Египта?",["Евфрат","Нил","Тигр","Иордан"],1,"Нил давал воду и плодородную почву для земледелия."],
["Как могли обращаться с умершими кошками в религиозных обрядах?",["Мумифицировать","Хоронить в море","Сжигать в печах","Оставлять на крышах"],0,"В Египте мумифицировали животных, в том числе кошек."],
["Почему кошек ценили в хозяйстве?",["Боролись с грызунами","Находили золото","Предсказывали урожай","Переносили камни"],0,"Кошки охотились на мышей и защищали запасы пищи."],
["Как называется сохранение тела после смерти?",["Мумификация","Гравировка","Керамика","Ирригация"],0,"Мумификация была связана с верой в загробную жизнь."],
["На чём писали древние египтяне?",["На папирусе","На пластиковой плёнке","На современной бумаге","На стекле"],0,"Папирус делали из одноимённого растения."],
["Как назывались правители Египта?",["Фараоны","Консулы","Самураи","Сенаторы"],0,"Фараон был верховным правителем Египта."],
["Какое животное, кроме кошек, имело религиозное значение?",["Скарабей","Панда","Кенгуру","Пингвин"],0,"Скарабея связывали с солнцем, обновлением и возрождением."],
["Из чего строили многие египетские пирамиды?",["Из камня","Из пластика","Из современного бетона","Из стекла"],0,"Пирамиды строили из каменных блоков."],
["Что такое иероглифы?",["Знаки письменности","Виды кораблей","Растения пустыни","Виды пирамид"],0,"Иероглифы — знаки древнеегипетской системы письма."],
["Почему египтяне ценили кошек?",["За пользу и связь с религией","Они были единственными питомцами","Они строили храмы","Они правили городами"],0,"Кошек ценили за пользу и связывали с богиней Бастет."]
];
const $=id=>document.getElementById(id);
let current=0,points=0,answered=false,options=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function progress(){let n=answered?current+1:current;$("bar").style.width=n/questions.length*100+"%"}
function render(){
answered=false;
let q=questions[current];
$("counter").textContent=`ВОПРОС ${current+1} ИЗ ${questions.length}`;
$("score").textContent="Баллы: "+points;
$("qnum").textContent="ВОПРОС № "+String(current+1).padStart(2,"0");
$("qtext").textContent=q[0];
$("answers").replaceChildren();
$("feedback").className="feedback";
$("ftitle").textContent="";$("ftext").textContent="";
$("next").classList.add("hidden");
options=shuffle(q[1].map((text,i)=>({text,correct:i===q[2]})));
options.forEach((o,i)=>{
let b=document.createElement("button");b.className="answer";b.type="button";
let l=document.createElement("span");l.className="letter";l.textContent=["А","Б","В","Г"][i];
let t=document.createElement("span");t.textContent=o.text;b.append(l,t);
b.onclick=()=>choose(i);$("answers").append(b);
});
$("question").style.animation="none";void $("question").offsetWidth;$("question").style.animation="";
progress();
}
function choose(i){
if(answered)return;answered=true;
let q=questions[current],ok=options[i].correct;
[...$("answers").children].forEach((b,j)=>{
b.disabled=true;
if(options[j].correct)b.classList.add("correct");
else if(i===j)b.classList.add("wrong");
});
if(ok){points++;$("feedback").className="feedback show good";$("ftitle").textContent="✓ Правильно!"}
else{$("feedback").className="feedback show bad";$("ftitle").textContent="✦ Не совсем!"}
$("ftext").textContent=q[3];$("score").textContent="Баллы: "+points;
$("next").textContent=current===questions.length-1?"Узнать результат →":"Следующий вопрос →";
$("next").classList.remove("hidden");progress();
}
function finish(){
$("quiz").classList.add("hidden");$("result").classList.remove("hidden");
$("bar").style.width="100%";$("final").textContent=points+"/"+questions.length;
let p=points/questions.length;
let data=p===1?["👑","Невероятно!","Все ответы правильные! Твои знания достойны царского трона.","Ты настоящий знаток Древнего Египта!"]:
p>=.75?["🏆","Прекрасный результат!","Ты хорошо знаешь историю Древнего Египта.","Ещё немного — и ты станешь экспертом!"]:
p>=.5?["🥇","Хорошая работа!","Ты уже знаешь немало интересного.","Попробуй ещё раз улучшить результат!"]:
["🐈","Начало путешествия!","Ты познакомился с тайнами Древнего Египта.","Не переживай из-за ошибок — теперь ты знаешь больше!"];
$("trophy").textContent=data[0];$("rtitle").textContent=data[1];$("rdesc").textContent=data[2];$("advice").textContent=data[3];
window.scrollTo({top:0,behavior:"smooth"});
}
$("next").onclick=()=>{if(!answered)return;if(current<questions.length-1){current++;render()}else finish()};
$("restart").onclick=()=>{current=0;points=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();window.scrollTo({top:0,behavior:"smooth"})};
render();
</script>
</body>
</html>
